<!DOCTYPE html>
<html>
<head>
    <title>Fraud Detection Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f5f5f5;
        }

        h1 {
            margin-bottom: 10px;
        }

        button {
            padding: 10px 18px;
            margin-bottom: 20px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #333;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        #status {
            margin-bottom: 15px;
            font-weight: bold;
        }

        /* Color-code verdicts (lowercase, matching JS output) */
        td.review {
            background-color: #fff3cd;
            color: #856404;
            font-weight: bold;
        }

        td.block {
            background-color: #f8d7da;
            color: #721c24;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Fraud Detection Dashboard</h1>

    <button onclick="loadAlerts()">Refresh Alerts</button>

    <div id="status">Click Refresh to load alerts.</div>

    <table id="alertsTable">
        <thead>
            <tr>
                <th>Account</th>
                <th>Amount</th>
                <th>City</th>
                <th>Verdict</th>
                <th>Score</th>
                <th>Reasons</th>
                <th>Timestamp</th>
            </tr>
        </thead>

        <tbody id="alertsBody">
            <!-- JavaScript will create rows here -->
        </tbody>
    </table>

    <script>

        const API_URL =
            'https://myqxknnynj.execute-api.ap-south-1.amazonaws.com/alerts';

        async function loadAlerts() {

            const status = document.getElementById('status');
            const alertsBody = document.getElementById('alertsBody');

            status.innerText = 'Loading alerts...';

            try {
                const response = await fetch(API_URL);

                if (!response.ok) {
                    throw new Error(`HTTP error: ${response.status}`);
                }

                const alerts = await response.json();
                console.log("Alerts received:", alerts);

                alertsBody.innerHTML = '';

                if (alerts.length === 0) {
                    alertsBody.innerHTML =
                        '<tr><td colspan="7">No alerts found.</td></tr>';
                } else {
                    alerts.forEach(alert => {
                        const row = document.createElement('tr');
                        const verdictClass = alert.verdict.toLowerCase();

                        row.innerHTML = `
                            <td>${alert.account_id}</td>
                            <td>${alert.amount}</td>
                            <td>${alert.city}</td>
                            <td class="${verdictClass}">${alert.verdict}</td>
                            <td>${alert.score}</td>
                            <td>${alert.reasons.join(', ')}</td>
                            <td>${alert.timestamp}</td>
                        `;

                        alertsBody.appendChild(row);
                    });
                }

                status.innerText = `Loaded ${alerts.length} fraud alerts.`;

            } catch (error) {
                console.error("Error loading alerts:", error);
                status.innerText = 'Failed to load alerts: ' + error.message;
            }
        }

        loadAlerts(); // run on page load

    </script>

</body>
</html>
